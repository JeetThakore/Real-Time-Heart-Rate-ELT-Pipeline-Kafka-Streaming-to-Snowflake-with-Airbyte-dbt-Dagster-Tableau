name: refresh-data

on:
  schedule:
    - cron: "7 2 * * *"
    - cron: "41 9 * * *"
    - cron: "18 14 * * *"
    - cron: "52 18 * * *"
    - cron: "29 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Decide whether to run
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ $((RANDOM % 100)) -lt 30 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Wait
        if: steps.gate.outputs.run == 'true' && github.event_name == 'schedule'
        run: sleep $((RANDOM % 2400))

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'

      - name: Generate and commit sample heart rate readings
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name "Jeet P Thakore"
          git config user.email "118195890+JeetThakore@users.noreply.github.com"
          batches=$((RANDOM % 3 + 1))
          for i in $(seq "$batches"); do
            python3 - <<'PY'
          import csv, json, os, random, time

          base = "mock-data/static/data"
          users = list(csv.DictReader(open(f"{base}/users.csv", newline="")))
          activities = list(csv.DictReader(open(f"{base}/activities.csv", newline="")))
          out_dir = "mock-data/stream/data"
          os.makedirs(out_dir, exist_ok=True)
          path = f"{out_dir}/heart_rates_{time.strftime('%Y-%m-%d', time.gmtime())}.jsonl"

          with open(path, "a") as fh:
              for _ in range(random.randint(5, 25)):
                  user = random.choice(users)
                  activity = random.choice(activities)
                  name = activity["activity_name"]
                  if name in ("Stand", "Sit", "Sleep"):
                      hr = random.randint(40, 80)
                  elif name in ("Run", "HIIT", "Swimming", "Kickboxing", "Multisport"):
                      hr = random.randint(130, 205)
                  else:
                      hr = random.randint(70, 150)
                  record = {
                      "user_id": user["userid"],
                      "heart_rate": str(hr),
                      "timestamp": str(int(time.time())),
                      "meta": {
                          "activity_id": activity["activity_id"],
                          "location": {
                              "latitude": str(round(random.uniform(-60, 70), 5)),
                              "longitude": str(round(random.uniform(-180, 180), 5)),
                          },
                      },
                  }
                  fh.write(json.dumps(record) + "\n")
          PY
            git add mock-data/stream/data
            git commit -q -m "add sample heart rate readings"
            sleep $((RANDOM % 240 + 20))
          done
          git push
